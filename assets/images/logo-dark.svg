<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <style>
      .logo-main {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #1A1A1A;
        text-transform: uppercase;
      }
      .logo-sub {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 7px;
        fill: #666666;
        text-transform: uppercase;
      }
      .logo-dot {
        fill: #C59B27;
      }
      .logo-bar {
        stroke: #C59B27;
        stroke-width: 2;
      }
    </style>
  </defs>
  <text x="0" y="34" class="logo-main">İZMİR<tspan class="logo-dot">.</tspan></text>
  <line x1="128" y1="26" x2="168" y2="26" class="logo-bar" />
  <text x="2" y="52" class="logo-sub">MUTFAK &amp; BANYO</text>
</svg>